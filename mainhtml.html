<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brushify</title>
    <style>
*{
    box-sizing:border-box;
}
body{
    background-image:url('image.jpeg');
    background-size:cover;
    font-family:Arial, sans-serif;
}
.write{
    height:400px;
    width:800px;
    border-radius:10%;
    border:1px solid black;
    background-color:rgb(255, 255, 255);
    display:flex;
    justify-content:space-around;
    align-items:center; 
    flex-wrap:wrap;
    overflow-y:auto;
    font-family:Arial, sans-serif;
    box-shadow:3px 4px 5px 5px rgb(155, 64, 64);
}
@media(max-width:500px){
     .write{
    height:250px;
    width:250px;
     border:1px solid black;
     display:flex;
     justify-content:center;
     align-items:center; 
     }
}
button {
    height:100px;
    width:200px;
    background-color:rgb(150, 54, 54);
    color:white;
    border-radius:10%;
    border:none;
    font-family:cursive;
}
.button{
    background-color:rgb(255, 255, 255);
    color:rgb(0, 0, 0);
    font-family:Arial, sans-serif;
    font-size:18px;
    border:1px solid black;
    cursor:pointer;
}
.green{
height:32px;
width:32px;
border-radius:50%;
border:1px solid black;
background-color:green;
}
.blue{
height:32px;
width:32px;
border-radius:50%;
border:1px solid black;
background-color:blue;
}
.yellow{
height:32px;
width:32px;
border-radius:50%;
border:1px solid black;
background-color:yellow;
}
.red{
height:32px;
width:32px;
border-radius:50%;
border:1px solid black;
background-color:red;
}
.pink{
height:32px;
width:32px;
border-radius:50%;
border:1px solid black;
background-color:pink;
}
.color{
     border-radius:10%;
     height:250px;
     width:300px;   
     border:1px solid black;
     display:flex;
     justify-content:space-around;
     align-items:center; 
      flex-wrap:wrap;
     background-color:rgb(255, 214, 165);
}
.text-color{
     border-radius:10%;
     height:250px;
     width:300px;   
     border:1px solid black;
     display:flex;
     justify-content:space-around;
     align-items:center; 
     flex-wrap:wrap;
     background-color:rgb(189, 224, 254);
}
.font{
     border-radius:10%;
    height:250px;
     width:300px;   
     border:1px solid black;
     display:flex;
     justify-content:space-around;
     align-items:center; 
     flex-wrap:wrap;
     background-color:rgb(202, 240, 200);
     height:auto;
     min-height:250px;
     width:380px;
     padding:15px;
     gap:10px;
}
.font center{
    width:100%;
}
.parent{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:100px;
    justify-content:space-around;
    align-items:center;
}
.button1{
height:58px;
width:58px;
padding:0;
border-radius:50%;
border:1px solid black;
background-color:rgb(255, 255, 255);
color:rgb(0, 0, 0);
font-family:Arial, sans-serif;
font-size:11px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}
.button2{
height:40px;
width:40px;
border-radius:50%;
border:1px solid black;
background-color:rgb(0, 0, 0);
color:rgb(238, 238, 238);
}
.button3{
height:40px;
width:40px;
border-radius:50%;
border:1px solid black;
background-color:rgb(0, 0, 0);
color:rgb(252, 252, 252);
}
@media (max-width: 900px) {
    .parent {
        grid-template-columns: repeat(2, 1fr);
    }

    .write {
        height: 350px;
    }
}
@media (max-width: 300px) {
    body {
        padding: 10px;
    }

    .write {
        height: 250px;
        width: 100%;
        border-radius: 5%;
    }

    .write:empty::before {
        font-size: 25px;
    }

    .parent {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .color,
    .text-color,
    .font {
        width: 100%;
        height: auto;
        min-height: 250px;
    }

    button {
        width: 150px;
        height: 65px;
    }
}
    </style>
</head>
<body>
    <center>
        <br><br><br>
        <h1 style="font-family:'Times New Roman', Times, serif;color:rgb(0, 0, 0);font-size:70px;">Brushify</h1>
        <div class="write" contenteditable="true"></div>
        <br>
        <button class="button" onclick="downloadText()">Download</button>
        <br><br>
        <div class="parent">
            <div class="color">
                <button onclick="changeBackgroundColor('hotpink')" class="button2" style="background-color:hotpink"></button>
                <button onclick="changeBackgroundColor('skyblue')" class="button2" style="background-color:skyblue"></button>
                <button onclick="changeBackgroundColor('orange')" class="button2" style="background-color:orange"></button>
                <button onclick="changeBackgroundColor('red')" class="button2" style="background-color:red"></button>
                <p style="color:rgb(0, 0, 0);font-size:50px;text-shadow: 3px 3px 5px rgb(255, 252, 252);">Background Color</p>
            </div>
            <div class="text-color">
                <button onclick="changeColor('hotpink')" class="button3" style="background-color:hotpink"></button>
                <button onclick="changeColor('skyblue')" class="button3" style="background-color:skyblue"></button>
                <button onclick="changeColor('orange')" class="button3" style="background-color:orange"></button>
                <button onclick="changeColor('red')" class="button3" style="background-color:red"></button>
                <center><p style="color:rgb(0, 0, 0);font-size:50px;text-shadow: 3px 3px 5px rgb(255, 252, 252);">Text Color</p></center>
            </div>
            <div class="font">
                <button onclick="changeFontSize('20px')" class="button1">20px</button>
                <button onclick="changeFontSize('30px')" class="button1">30px</button>
                <button onclick="changeFontSize('40px')" class="button1">40px</button>
                <button onclick="changeFontSize('50px')" class="button1">50px</button>
                <button onclick="changeFontFamily('cursive')" class="button1">Cursive</button>
                <button onclick="changeFontFamily('Arial')" class="button1">Arial</button>
                <button onclick="changeFontFamily('Sans')" class="button1">Sans</button>
                <button onclick="changeFontFamily('sans-serif')" class="button1">Sans-serif</button>
                <button onclick="changeFontFamily('Georgia')" class="button1">Georgia</button>
                <center><p style="color:rgb(0, 0, 0);font-size:50px;text-shadow: 3px 3px 5px rgb(255, 252, 252);">Text Size and Font Style</p></center>
            </div>
        </div>
    </center>
    <script>
        function changeBackgroundColor(bgclr){
            document.getElementsByClassName('write')[0].style.backgroundColor=bgclr;
        }
        function changeColor(clr){
            document.getElementsByClassName('write')[0].style.color=clr;
        }
        function changeFontSize(val){
            document.getElementsByClassName('write')[0].style.fontSize=val;
        }
        function changeFontFamily(font){
            document.getElementsByClassName('write')[0].style.fontFamily=font;
        }
        function downloadText(){
            var text = document.getElementsByClassName('write')[0].innerText;
            var blob = new Blob([text], { type: 'text/plain' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'brushify.txt';
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
